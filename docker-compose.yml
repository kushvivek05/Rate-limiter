services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      RATE_STORE: ${RATE_STORE:-redis}
      RATE_ALGORITHM: ${RATE_ALGORITHM:-fixed-window}
      RATE_WINDOW_MS: ${RATE_WINDOW_MS:-60000}
      RATE_MAX: ${RATE_MAX:-5}
      RATE_REFILL_RATE: ${RATE_REFILL_RATE:-1}
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-rate_limiter}
      MONGO_RATE_LIMIT_COLLECTION: ${MONGO_RATE_LIMIT_COLLECTION:-rate_limits}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_dev_only}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rate_limiter}
      MYSQL_RATE_LIMIT_TABLE: ${MYSQL_RATE_LIMIT_TABLE:-rate_limits}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-local_dev_only}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rate_limiter}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  redis-data:
  mongo-data:
  mysql-data:
